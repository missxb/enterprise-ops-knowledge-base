#============================================================================
# Redis 7.x 生产环境优化配置
# 适用于 8C32G 规格的缓存服务器
#============================================================================

#==================== 网络配置 ====================
bind 0.0.0.0
port 6379
tcp-backlog 65535
timeout 300
tcp-keepalive 300
maxclients 10000

#==================== 通用配置 ====================
daemonize yes
supervised systemd
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log
databases 16

#==================== 内存配置 ====================
# 最大内存（物理内存的 60-70%）
maxmemory 20gb

# 内存淘汰策略
# allkeys-lru: 所有键使用 LRU 算法淘汰
maxmemory-policy allkeys-lru

# LRU 采样数（越大越精确，但越慢）
maxmemory-samples 10

# 内存碎片整理
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 5
active-defrag-cycle-max 25

#==================== 持久化配置 ====================
# RDB 快照
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis

# AOF 持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

#==================== 复制配置 ====================
# 从节点配置
# replicaof <masterip> <masterport>
replica-read-only yes
replica-serve-stale-data yes
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-backlog-size 256mb
repl-backlog-ttl 3600

#==================== 哨兵配置 ====================
# sentinel monitor mymaster <master-ip> <master-port> 2
# sentinel down-after-milliseconds mymaster 5000
# sentinel failover-timeout mymaster 60000
# sentinel parallel-syncs mymaster 1

#==================== 集群配置 ====================
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 15000
# cluster-require-full-coverage no
# cluster-allow-reads-when-down yes

#==================== 安全配置 ====================
# 密码认证
requirepass YourStrongPassword
masterauth YourStrongPassword

# 禁用危险命令
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS "KEYS_ADMIN_ONLY"
rename-command DEBUG ""
rename-command CONFIG "CONFIG_ADMIN_ONLY"

#==================== 慢日志 ====================
slowlog-log-slower-than 10000
slowlog-max-len 128

#==================== 延迟监控 ====================
latency-monitor-threshold 100

#==================== 客户端输出缓冲 ====================
client-output-buffer-limit normal 512mb 256mb 120
client-output-buffer-limit replica 1024mb 512mb 120
client-output-buffer-limit pubsub 64mb 32mb 60

#==================== Lua 脚本 ====================
lua-time-limit 5000
