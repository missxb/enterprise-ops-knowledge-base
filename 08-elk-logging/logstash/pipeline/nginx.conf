# Logstash Nginx 日志处理 Pipeline

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["filebeat-logs"]
    group_id => "logstash-nginx"
    consumer_threads => 4
    decorate_events => true
    codec => json
  }
}

filter {
  # 只处理 Nginx 日志
  if [fields][log_type] == "nginx" {

    # 解析访问日志
    if [file][path] =~ /access/ {
      grok {
        match => {
          "message" => '%{IPORHOST:client_ip} - %{DATA:user_name} \[%{HTTPDATE:access_time}\] "%{WORD:http_method} %{DATA:request_uri} HTTP/%{NUMBER:http_version}" %{NUMBER:response_code} %{NUMBER:body_bytes_sent} "%{DATA:referrer}" "%{DATA:user_agent}" %{NUMBER:request_time} %{NUMBER:upstream_response_time}'
        }
        remove_field => ["message"]
      }

      # 解析时间
      date {
        match => ["access_time", "dd/MMM/yyyy:HH:mm:ss Z"]
        target => "@timestamp"
        timezone => "Asia/Shanghai"
      }

      # 类型转换
      mutate {
        convert => {
          "response_code" => "integer"
          "body_bytes_sent" => "integer"
          "request_time" => "float"
          "upstream_response_time" => "float"
        }
      }

      # GeoIP 解析
      geoip {
        source => "client_ip"
        target => "geoip"
        fields => ["country_name", "region_name", "city_name", "latitude", "longitude"]
      }

      # User-Agent 解析
      useragent {
        source => "user_agent"
        target => "ua"
      }

      # 请求分类
      if [request_uri] =~ /^\/api\// {
        mutate { add_field => { "request_category" => "api" } }
      } else if [request_uri] =~ /\.(html|htm|css|js|png|jpg|gif|ico)$/ {
        mutate { add_field => { "request_category" => "static" } }
      } else {
        mutate { add_field => { "request_category" => "other" } }
      }

      # 慢请求标记
      if [request_time] > 3 {
        mutate { add_field => { "slow_request" => "true" } }
      }

      # 错误请求标记
      if [response_code] >= 500 {
        mutate { add_field => { "error_type" => "server_error" } }
      } else if [response_code] >= 400 {
        mutate { add_field => { "error_type" => "client_error" } }
      }
    }

    # 解析错误日志
    if [file][path] =~ /error/ {
      grok {
        match => {
          "message" => '%{DATA:timestamp} \[%{DATA:log_level}\] %{NUMBER:pid}#%{NUMBER:tid}: (\*%{NUMBER:connection_id} )?%{GREEDYDATA:error_message}'
        }
      }

      mutate {
        add_field => { "log_level" => "%{log_level}" }
      }
    }

    # 删除不需要的字段
    mutate {
      remove_field => ["agent", "ecs", "host", "input", "log", "tags"]
    }
  }

  # 非 Nginx 日志直接跳过
  else {
    drop { }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "nginx-access-%{+yyyy.MM.dd}"
    # ILM 策略
    ilm_enabled => true
    ilm_rollover_alias => "nginx-access"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "nginx-policy"
  }

  # 慢请求告警
  if [slow_request] == "true" {
    http {
      url => "http://alertmanager:9093/api/v1/alerts"
      http_method => "post"
      format => "json"
    }
  }
}
