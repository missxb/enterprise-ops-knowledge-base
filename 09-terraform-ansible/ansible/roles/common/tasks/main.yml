#============================================================================
# Common Role - 通用系统配置
#============================================================================

---
- name: 设置主机名
  hostname:
    name: "{{ inventory_hostname }}"

- name: 配置 /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
    state: present
  loop: "{{ groups['all'] }}"
  when: hostvars[item].ansible_host is defined

- name: 配置时区
  timezone:
    name: Asia/Shanghai

- name: 安装 NTP
  yum:
    name: chrony
    state: present
  when: ansible_os_family == "RedHat"

- name: 启用 NTP 服务
  systemd:
    name: chronyd
    state: started
    enabled: yes

- name: 安装基础软件包
  yum:
    name:
      - wget
      - curl
      - vim
      - net-tools
      - bind-utils
      - tree
      - htop
      - iotop
      - sysstat
      - jq
      - bash-completion
      - unzip
      - git
      - lsof
      - telnet
      - nc
    state: present

- name: 配置系统参数
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-tuning.conf
  loop:
    - { key: "net.core.somaxconn", value: "65535" }
    - { key: "net.ipv4.tcp_max_syn_backlog", value: "8192" }
    - { key: "net.ipv4.tcp_fin_timeout", value: "15" }
    - { key: "net.ipv4.tcp_tw_reuse", value: "1" }
    - { key: "net.ipv4.ip_local_port_range", value: "1024 65535" }
    - { key: "fs.file-max", value: "1048576" }
    - { key: "vm.swappiness", value: "0" }

- name: 配置文件描述符限制
  pam_limits:
    domain: '*'
    limit_type: "{{ item.type }}"
    limit_item: nofile
    value: "{{ item.value }}"
  loop:
    - { type: soft, value: "1048576" }
    - { type: hard, value: "1048576" }

- name: 禁用 SELinux
  selinux:
    state: disabled
  when: ansible_os_family == "RedHat"

- name: 配置日志轮转
  copy:
    dest: /etc/logrotate.d/app
    content: |
      /data/logs/*.log {
          daily
          missingok
          rotate 30
          compress
          delaycompress
          notifempty
          copytruncate
          maxsize 200M
      }

- name: 创建运维用户
  user:
    name: opsuser
    groups: wheel
    shell: /bin/bash
    create_home: yes
    state: present

- name: 配置 sudo 免密
  lineinfile:
    path: /etc/sudoers.d/opsuser
    line: "opsuser ALL=(ALL) NOPASSWD: ALL"
    create: yes
    validate: "visudo -cf %s"
