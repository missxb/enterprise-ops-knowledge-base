# Production 环境 Kustomize Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - network-policy.yaml
  - pod-monitor.yaml

commonLabels:
  env: production

commonAnnotations:
  team: platform
  cost-center: production

images:
  - name: app
    newName: registry.example.com/app
    newTag: v1.2.3

replicas:
  - name: app
    count: 5

patches:
  # 生产环境资源调整
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 2000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi

  # 生产环境 HPA 调整
  - target:
      kind: HorizontalPodAutoscaler
      name: app
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 5
      - op: replace
        path: /spec/maxReplicas
        value: 50

  # 生产环境 PDB 调整
  - target:
      kind: PodDisruptionBudget
      name: app
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 3

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - APP_ENV=production
      - LOG_LEVEL=warn
      - DB_HOST=mysql-production.db.svc
      - REDIS_HOST=redis-production.db.svc
      - CACHE_TTL=3600
      - MAX_CONNECTIONS=200

secretGenerator:
  - name: app-secrets
    behavior: merge
    envs:
      - secrets.env
